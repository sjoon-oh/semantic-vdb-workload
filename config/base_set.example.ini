; Example base_set.ini. All paths are PLACEHOLDERS: edit them before use.
; Builds the shared base set (initial base + fixed insertion sequence) once.

[input]
; Raw vector file that every row is drawn from (bin layout, element type by extension).
raw_file = /path/to/base.1B.u8bin
; l2 (squared Euclidean distance) or ip (inner product).
metric = l2

[partition]
seed = 1
; Number of vectors of the initial index.
num_base = 1000000
; random picks the base rows at random; prefix takes the first num_base rows
; (prefix lets an index that was built from the file prefix be reused).
base_selection = random
; Rows reserved as queries (only needed for seeds.mode = base_rows).
num_query_rows = 0
; Number of vectors available for insertion, or "rest" for every remaining row
; ("rest" needs about 8 bytes of memory per raw row).
max_inserts = 1000000

[output]
dir = /data2/sukjoon/toucann-claude/semantic-workload
name = sift_1m_base_s1
