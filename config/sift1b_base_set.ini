; SIFT1B base set: 100M random base vectors + 1M vectors reserved for insertion.
; Build:  PYTHON=<env>/bin/python script/build_base_set.sh config/sift1b_base_set.ini
; Every option is described in config/base_set.example.ini.

[input]
; Raw vector file that every row is drawn from (uint8, 1e9 x 128).
raw_file = /home/sukjoon/Workspace/data2/datasets/sift1b/base.1B.u8bin
metric = l2

[partition]
seed = 1
; Number of vectors of the initial index.
num_base = 100000000
; random picks the base rows at random; prefix takes the first num_base rows (= SIFT100M) and
; draws the insertion rows at random from the rows behind them.
base_selection = prefix
; Rows reserved as queries (only needed for seeds.mode = base_rows).
num_query_rows = 0
; Number of vectors available for insertion. Must hold the largest update count of the
; workload (90% of 1000000 requests = 900000 insertions).
max_inserts = 1000000

[output]
; The base set is written to <dir>/<name>.
dir = /home/sukjoon/Workspace/data2/workloads/similarity-skew
name = sift1b_100m
