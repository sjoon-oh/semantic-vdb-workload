; SPACEV1B base set: the first 100M vectors (= SPACEV100M) + 1M vectors reserved for insertion.
; Build:  PYTHON=<env>/bin/python script/build_base_set.sh config/spacev1b_base_set.ini
; Every option is described in config/base_set.example.ini.

[input]
; Raw vector file that every row is drawn from (int8, 1,402,020,720 x 100). The tool takes the
; element type from the file extension and the original is named ".bin", so this is a link
; with the extension ".i8bin" to /data2/sukjoon/datasets/spacev1b/vectors.bin/vectors.bin.
raw_file = /home/sukjoon/Workspace/data2/workloads/similarity-skew/_inputs/spacev1b/base.1B.i8bin
metric = l2

[partition]
seed = 1
; Number of vectors of the initial index.
num_base = 100000000
; random picks the base rows at random; prefix takes the first num_base rows (= SPACEV100M) and
; draws the insertion rows at random from the rows behind them.
base_selection = prefix
; Rows reserved as queries (only needed for seeds.mode = base_rows).
num_query_rows = 0
; Number of vectors available for insertion. Must hold the largest update count of the
; workload (90% of 1000000 requests = 900000 insertions).
max_inserts = 1000000

[output]
; The base set is written to <dir>/<name>.
dir = /home/sukjoon/Workspace/data2/workloads/similarity-skew
name = spacev1b_100m
