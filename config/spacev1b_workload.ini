; SPACEV1B workload family on top of the base set of config/spacev1b_base_set.ini. Same values as
; config/sift1b_workload.ini; only the data dependent ones differ (names, paths, num_groups and
; the parallel settings of THIS machine).
; Build:  PYTHON=<env>/bin/python script/build_workload.sh config/spacev1b_workload.ini
;
; Every option the program reads is written out here with an explicit value. Where the value
; is NOT the program's default, the line above it says so ("default: ..."). The meaning and
; the allowed values of each option are in config/workload.example.ini.
; Options that do not apply to this setup are left out: [seeds] group_id_file (only for
; mode = external) and [evaluation] eval_file (only for source = external).

; =========================================================================================
[workload]
name = spacev1b_100m_workload
; default: error (stop when this family exists). extend adds only the pools that are missing
; (new target overlaps / group sizes) and, with stream_groundtruth = true below, lets the
; follow-up stage answer the stream queries of this EXISTING family; see
; config/workload.example.ini. extend here because the family is already built.
existing = extend

; =========================================================================================
[base_set]
dir = /home/sukjoon/Workspace/data2/workloads/similarity-skew/spacev1b_100m

; =========================================================================================
[seeds]
mode = public_queries
; Public queries (int8, 29,316 x 100): a link with the extension ".i8bin" to
; /data2/sukjoon/datasets/spacev1b/query.bin.
query_file = /home/sukjoon/Workspace/data2/workloads/similarity-skew/_inputs/spacev1b/query.public.29K.i8bin
; default: all (= 29316 groups for these queries). 10000 random queries (without replacement) become
; the groups, so that the number of groups and the pool sizes equal the SIFT1B family and the Zipf
; curves are comparable. The evaluation queries still use all 29316 original queries.
num_groups = 10000
seed = 11

; =========================================================================================
[groups]
group_size = 100, 200, 400, 1000
include_original = true
neighbours = 500
; default: 16. Noise goes along the top 32 principal axes of the 500 neighbours.
axes = 32
residual = false
; Mean top-10 overlap between a seed and its variants; alpha is searched to reach it.
; default: 0.8. A list makes the target overlap a combination axis: one noise scale (alpha) and
; one set of pools per value, in the directories o80/, o50/ and o20/ (each with every group
; size and update percentage). Neighbours and PCA are made once. See config/workload.example.ini.
target_overlap = 0.8, 0.5, 0.2
; Seeds sampled for the alpha search; the overlap is re-measured on all seeds afterwards.
calibration_queries = 500
overlap_tolerance = 0.02

; =========================================================================================
[stream]
; Requests per set = reads + updates.
total_requests = 1000000
num_steps = 100
zipf_exponents = 0.3, 0.6, 0.9, 0.99
member_selection = uniform
seed = 31
; true would also make stream_uniform_unique (every request a different vector); it needs
; 1000000 reads <= 10000 groups x group_size, i.e. group_size >= 100.
uniform_unique = false

; =========================================================================================
[updates]
seed = 21
; One set per percentage: u0, u10, u25, u50, u90. Largest update count = 900000 insertions.
update_percents = 0, 10, 25, 50, 90

; =========================================================================================
[evaluation]
source = original
; default: 1. Evaluation queries are scored at step 0, every checkpoint_every steps and at the
; last step: this is the only ground truth that is built (see stream_groundtruth below).
checkpoint_every = 10
eval_k = 100

; =========================================================================================
[groundtruth]
; default: false. true = after the build, a follow-up stage computes the exact answers of the
; stream queries (Zipf requests); with existing = extend the same command adds them to this
; family. It scans the universe once per distinct query vector (hours to days on 100M
; vectors for ALL pools). true here, but for ONE pool first (stream_pools below).
stream_groundtruth = true
; Neighbours stored per stream query: LARGER than eval_k (100) so that recall@100 can also be
; scored with a tolerance; used only when stream_groundtruth = true.
stream_k = 120
; default: all (every pool). A SAMPLE RUN: only the pool o50/g200 (overlap 0.5, group size 200),
; with all its 4 streams and 5 update percentages (20 stream/set pairs). Answers that exist are
; skipped, so to widen the run later name more pools (o50/*, o80/g200, ...) or write all; what
; was computed is kept.
stream_pools = all
; default: 60. Seconds between the progress lines of the stage.
progress_seconds = 60
device = gpu
base_batch_rows = auto
query_chunk_rows = auto

; =========================================================================================
[parallel]
; default: 1. GPU 1 and NUMA node 1 of THIS machine (the GPU sits on node 1; node 1 has 16
; physical cores). These are the program defaults, written out so that the values of another
; machine are not mixed in.
gpus = 1
gpu_max_used_mb = 1024
workers_per_gpu = 1
; auto = the physical cores of numa_node (16 here).
cpu_workers = auto
numa_node = 1
