; Example workload.ini. All paths are PLACEHOLDERS: edit them before use.
;
; Builds a FAMILY of workload sets (one per update percentage) that reference one existing
; base set.
;
; Output layout
;   <base_set>/workloads/<name>/o80/g50/u0, o80/g50/u25, ..., o80/g200/u0, o50/g200/u25, ...
;   One directory o<percent> per target overlap, inside it one pool directory g<group_size>
;   per group size, inside that one set directory u<percent> per update percentage (variants
;   = none: g1/u.., external seeds: external/u..; they add no noise, so there is no overlap
;   level). Each set directory is complete on its own; it holds, per stream, the step_xxxxx
;   query files, the deleted ids and the ground truth. <name>/family.json lists the pools and
;   sets, <name>/build_report.json the time of every build stage, <name>/shared/ the results
;   that a later run reuses when it adds pools (see "existing" below).
;
; How to read this file
;   key = value     an active setting. Required keys are always active; the others show the
;                   value this example chooses.
;   ; key = value   an OPTIONAL setting, shown with its DEFAULT value. Remove the leading
;                   ";" to change it. Every option the program reads is listed here.
; Text after " ;" on a setting line is a comment too. Paths and values may contain "%".
; A test (test_cli.py) checks that this file parses and mentions every option the program
; reads.

; =========================================================================================
[workload]
; (required) Name of the family directory <base_set>/workloads/<name>/. A plain directory
; name: no "/" and no "..".
name = wl_g200_o80

; What to do when the family <name> already exists.
;   error   (default) stop; an existing family is never touched.
;   extend  add only the pools that are missing, i.e. new target overlaps and new group
;           sizes, and skip the pools that exist. The family keeps its sets unchanged. The
;           neighbour search, the PCA bases, the evaluation ground truth and the deleted ids
;           are taken from <name>/shared/, so adding a pool costs only that pool. Everything
;           else (seeds, [groups] except group_size and target_overlap, [stream], [updates],
;           [evaluation], [groundtruth], the base set and the query files) must be the same
;           as when the family was made, otherwise the run stops and names the difference:
;           build such a change as a new family. A family made before overlap levels existed
;           (format 2) cannot be extended.
; existing = error

; =========================================================================================
[base_set]
; (required) The base set directory made earlier by "base-set" (it holds base_set.json).
dir = /data2/sukjoon/toucann-claude/semantic-workload/sift_1m_base_s1

; =========================================================================================
[seeds]
; Where the original (seed) queries come from.
;   public_queries  a query file of the dataset; every query is a candidate seed.
;   base_rows       the rows the base set reserved as queries (base set built with
;                   num_query_rows > 0), for datasets without public queries.
;   external        vectors made elsewhere (e.g. paraphrases embedded by a text model) plus
;                   one group id per vector. They are used as they are (no variants are
;                   made); only skew and updates are added. Needs group_id_file and
;                   [evaluation] source = external.
; (required) mode = public_queries | base_rows | external
mode = public_queries

; (required for public_queries and external) Query file in bin format; its dtype and
; dimension must match the base set.
query_file = /path/to/query.public.10K.u8bin

; (required for external only) One int32 group id per vector of query_file (.ibin).
; group_id_file = /path/to/groups.ibin

; "all" = one group per original query; an integer selects that many queries at random
; (without replacement; the evaluation queries still use every original query).
; num_groups = all

; (required) Random seed of the subset selection (only used when num_groups is an integer).
seed = 11

; =========================================================================================
[groups]
; How the members of a group are made.
;   n2    N2 noise: PCA of the seed's nearest base vectors, noise only along the top "axes"
;         principal directions, scale (alpha) searched until the variants share
;         "target_overlap" of their top-10 neighbours with the seed.
;   none  NO variants: the given queries themselves are the pool, one query per group. No
;         neighbour search and no calibration are done. group_size must be 1 (or omitted).
;         Combine with [stream] uniform_unique = true for a one-pass stream of the given
;         queries (see the end of the [stream] section).
; Ignored in seeds mode external (its groups are given).
; variants = n2

; Number of similar queries per group (members, incl. the seed if include_original).
; Default 200 for variants = n2; 1 for variants = none.
; group_size = 200
; A comma-separated LIST makes the group size a combination axis: one pool (and one
; directory g<size>) per size and overlap, each crossed with every update percentage.
; Example:
;   group_size = 50, 200
; Values must be distinct integers >= 1. With variants = none only 1 (or nothing) is
; allowed; for seeds mode external the sizes are ignored. The neighbour search, the PCA and
; alpha are computed once for all sizes, and the ground-truth lists are shared (a size
; costs little extra GPU time). Every pool must hold at least as many vectors as the longest
; set has reads when uniform_unique = true (10000 seeds x 50 = 500000 vectors cannot supply
; 1000000 distinct requests: the build stops before reading any data).

; true makes the seed query itself one of the group_size members.
; include_original = false

; Nearest base vectors used to learn the local noise directions (>= 2).
; neighbours = 500

; Number of principal axes that receive noise (1 <= axes <= neighbours - 1, and <= dim).
; axes = 16

; true adds the variance the kept axes do not explain as isotropic noise.
; residual = false

; Mean fraction (0..1, exclusive) of a seed's top-10 neighbours that its variants must
; share; 0.8 = 8 of 10. The noise scale alpha is searched automatically to reach it.
; A comma-separated LIST makes the target overlap a combination axis: one noise scale and one
; set of pools (directory o<percent>, e.g. o80 for 0.8, o12p5 for 0.125) per value, each
; crossed with every group size and update percentage. Example:
;   target_overlap = 0.8, 0.5
; Values must be distinct. The neighbour search and the PCA are done once for all values;
; each value adds the pool generation, the overlap measurement of its pools and (with
; stream_groundtruth = true) their ground-truth scans. A value can also be added to a
; finished family later (see "existing"). Ignored for variants = none and seeds mode external.
; target_overlap = 0.8

; Seeds (random subset) used by the alpha search; the result is re-measured on all seeds
; and written to workload.json.
; calibration_queries = 500

; The alpha search stops when |mean overlap - target_overlap| <= overlap_tolerance
; (0 < tolerance < 0.5). Smaller is more exact but takes more iterations and may fail.
; overlap_tolerance = 0.02

; =========================================================================================
[stream]
; (required) Requests per workload set = reads + updates, split evenly into num_steps
; steps. One update = one insertion + one deletion (see [updates]).
total_requests = 1000000

; (required) Steps per set. Each step runs: deletions, then insertions, then its queries;
; ground truth uses the active set after both. Needs at least one read per step.
num_steps = 100

; (required) One Zipf stream per exponent, directory stream_zipf_<exponent>. Group
; popularity ~ 1 / rank^exponent; 0 = uniform popularity with replacement (exact repeats
; stay possible). "none" = no Zipf stream (then uniform_unique must be true).
zipf_exponents = 0.3, 0.6, 0.99

; How a request picks a member of its group (only "uniform" exists).
; member_selection = uniform

; Random seed of the streams.
; seed = 31

; true also makes the stream "stream_uniform_unique": requests drawn uniformly from ALL
; pool vectors WITHOUT replacement, so every request is a different vector (no exact
; repeats; only semantic similarity can give cache hits). There is no popularity skew,
; because skew and "no repeats" cannot both hold. It needs reads <= pool size, checked
; before any data is read: the longest set (smallest update percentage) must have at most
; num_groups x group_size reads (variants = none: at most the number of given queries).
; The stream is drawn once and each set uses its first "reads" requests.
; With a list of group sizes the check applies to EVERY pool size.
uniform_unique = true

; Recipe "pure given queries, no repeats": variants = none, zipf_exponents = none,
; uniform_unique = true, and total_requests <= the number of queries (the update
; percentages shrink the reads further, e.g. 25% updates leaves 75% reads).

; =========================================================================================
[updates]
; Random seed of the deletion choice (deletions are uniform over the alive vectors).
; seed = 21

; (required) One workload set per percentage of total_requests that are updates; names are
; "u" + percentage (u0, u25, u50; 12.5 -> u12p5). An update = one insertion + one deletion,
; so insertions = deletions = updates and the alive count stays at the base size:
;   u0  =  0% -> 1000000 reads (read-only)
;   u25 = 25% ->  750000 reads, 250000 insertions, 250000 deletions
;   u50 = 50% ->  500000 reads, 500000 insertions, 500000 deletions
; Rules: 0 <= percentage < 100; total_requests * percentage / 100 must be a whole number
; (no rounding); no repeated percentage; every step needs at least one read; the base
; set's insert pool must hold the largest update count (here 500000).
update_percents = 0, 25, 50
; The deleted ids depend only on the percentage and this seed, so with several group sizes
; the sets of equal percentage delete exactly the same vectors and share their evaluation
; ground truth (stored once, hard-linked).

; =========================================================================================
[evaluation]
; Evaluation queries measure how recall wobbles while vectors are inserted and deleted.
; They are meant for the index only and do not go through a cache.
;   original  every ORIGINAL (unperturbed) query of the seed source.
;   external  the vectors of eval_file (required for seeds mode external).
; source = original

; (required when source = external) Evaluation queries in bin format.
; eval_file = /path/to/eval_queries.u8bin

; Evaluation queries are scored at step 0 (initial base), every checkpoint_every steps and
; at the last step. A read-only set (u0) is scored at step 0 only.
checkpoint_every = 10

; Neighbours stored per evaluation query.
; eval_k = 100

; =========================================================================================
[groundtruth]
; true: after the workload is built, a follow-up stage computes the exact answers of every
; stream query (the requests of the Zipf and uniform_unique streams) at the step it runs.
; This is by far the most expensive part: it scans the whole universe once for every
; distinct query vector, and takes hours to days on a large data set. Sets that already have
; their answers are skipped, so the same command can be repeated after an interruption, and
; "existing = extend" (see [workload]) adds the answers to a family that is already built.
; false (the default): the stream query files are written but there is no
; groundtruth/stream_* directory; only the evaluation queries (see [evaluation]) get ground
; truth, at their checkpoints.
; stream_groundtruth = false

; Neighbours stored per stream query (used only when stream_groundtruth = true). It must be
; LARGER than the k at which you score recall ([evaluation] eval_k, e.g. 100 -> 120): the
; extra depth lets a scorer accept answers that are slightly out of the top-k because a
; harness saw the updates one step earlier or later. (The extra length that deletions need is
; added automatically to the internal lists and does not depend on this value.) Smaller than
; eval_k is an error, equal to it a warning. A set that already has answers for another
; stream_k is refused, never changed.
; stream_k = 120

; Which pools get stream answers: all (the default, every pool of the family) or pool names
; and glob patterns, e.g. o50/g200 or o80/*. A chosen pool gets ALL its streams and ALL its
; update percentages (the answers of the update sets are derived from the same lists, so
; splitting them would save nothing). Name pools only to get a first usable result sooner.
; stream_pools = all

; Seconds between the progress lines of the follow-up stage (count, speed, time left).
; progress_seconds = 60

; gpu uses cupy (needs a free GPU: see script/build_workload.sh); cpu uses numpy. The
; results are the same, cpu is much slower.
; device = gpu

; Base vectors compared per pass, and queries compared at once. "auto" (the default)
; chooses them from the free memory of the selected GPU: a budget of 60% of it (at most
; 8 GiB per worker), divided by the workers that share the GPU, at about 40 bytes per
; (base vector, query) pair; it is halved and retried on an out-of-memory error. A number
; fixes the size (peak GPU memory is about 38 bytes x base_batch_rows x query_chunk_rows,
; 3.6 GiB for 100000 x 1024 at dim 128). For integer-valued data (uint8, int8) the results
; do not depend on these sizes; for float data the last bits of a distance can. The values
; actually used are written to workload.json.
; base_batch_rows = auto
; query_chunk_rows = auto

; =========================================================================================
[parallel]
; The defaults below are the values of THIS machine (GPU 1 sits on NUMA node 1). On another
; machine a GPU or NUMA node that does not exist is an error, never silently skipped, so
; change gpus / numa_node there. With device = cpu the GPU settings are ignored.

; GPUs to use for the ground truth and the neighbour searches. Numbers are nvidia-smi
; indexes (PCI bus order).
;   auto   every GPU that is free (used memory below gpu_max_used_mb)
;   none   no GPU (use together with device = cpu)
;   1      GPU 1 only;  0,1  both GPUs
; A GPU you name that is in use is an error. One worker process runs per GPU (see
; workers_per_gpu); several processes on one GPU only take turns, they do not add speed.
; gpus = 1

; A GPU counts as free when it uses less than this many MiB (same rule as the machine guard).
; gpu_max_used_mb = 1024

; Worker processes per GPU. 1 is the sensible value; a higher number divides the memory
; budget of "auto" batch sizes between the workers and each worker holds its own CUDA context
; (about 1 GiB).
; workers_per_gpu = 1

; CPU worker processes for the N2 pool (per-seed PCA and variants), the CPU ground truth
; (device = cpu), hashing and file writing.
;   auto   the number of PHYSICAL cores of numa_node that this process may use (16 on node 1
;          of this machine); hyper-thread siblings count once
;   N      that many processes (reduced to the physical cores with a message)
; cpu_workers = auto

; Pins this process and all workers to the CPUs of one NUMA node (os.sched_setaffinity;
; memory follows by the first-touch policy, it is not strictly bound).
;   none   no pinning
;   auto   the node of the selected GPU (one node per GPU if several are used)
;   1      node 1 (the default of this machine; a missing node is an error)
; numa_node = 1
